services:
  - type: web
    name: trainingsprofil-api
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.13"
      - key: TRAINING_ENVIRONMENT
        value: production
      - key: TRAINING_GOOGLE_CLIENT_ID
        value: 448679981151-siu7ifltrqhle8koamlb70tnkjuqcg7m.apps.googleusercontent.com
      - key: TRAINING_DATABASE_URL
        fromDatabase:
          name: trainingsprofil-db
          property: connectionString
      - key: TRAINING_JWT_SECRET_KEY
        generateValue: true
      - key: TRAINING_CORS_ORIGINS
        fromService:
          type: web
          name: trainingsprofil-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: trainingsprofil-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.23.2"
      - key: VITE_GOOGLE_CLIENT_ID
        value: 448679981151-siu7ifltrqhle8koamlb70tnkjuqcg7m.apps.googleusercontent.com
      - key: VITE_API_URL
        fromService:
          type: web
          name: trainingsprofil-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: trainingsprofil-db
    region: frankfurt
    plan: basic-256mb
    databaseName: trainingsprofil
    user: trainingsprofil
    postgresMajorVersion: "17"
